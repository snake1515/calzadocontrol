services:
  - type: web
    name: calzadocontrol
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPERADMIN_USER
        value: softgest
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SOFTGEST_WHATSAPP
        sync: false
      - key: NOMBRE_NEGOCIO
        value: CalzadoControl
