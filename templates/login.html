<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · {{ NOMBRE_NEGOCIO }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=STATIC_V) }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:16px"><img src="{{ url_for('static', filename='logo_login.jpg', v=STATIC_V) }}" alt="{{ NOMBRE_NEGOCIO }}" style="width:220px;max-width:70%;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.18)"><div class="muted" style="margin-top:10px;font-size:.9rem">Producción, nómina, ventas y cartera</div></div>
    <div class="card">
      {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
      {% endwith %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field"><label for="u">Usuario</label><input class="input" id="u" name="username" autocomplete="username" required autofocus></div>
        <div class="field"><label for="p">Contraseña</label><input class="input" id="p" type="password" name="password" autocomplete="current-password" required></div>
        <div class="field"><label class="check"><input type="checkbox" name="recordar" value="1"> Mantener sesión iniciada</label></div>
        <button class="btn block">Ingresar</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
